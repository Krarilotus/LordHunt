ai: هوش مصنوعی
diagnostics_group: عیب‌یابی
diagnostics_group_descr: برای آزمایش و عیب‌یابی.
diagnostics_log: ثبت تصمیم‌های مهاجمان در گزارش
diagnostics_log_details: هرگاه حمله‌ای به سمت قلعهٔ دیگری هدایت شود، نیروها جدا شوند یا تعقیب‌کنندگان اعزام شوند یا بازگردند، یک خط در ucp3.log می‌نویسد.
hiding_enabled: حمله به قلعه‌ای که لرد شما در آن پنهان شده است
hiding_enabled_details: وقتی لرد شما بیرون از دیوارهای خودتان و درون دیوارهای یک قلعهٔ متحد باشد که مهاجمان نمی‌توانند پیاده وارد آن شوند، حمله به سمت آن قلعه هدایت می‌شود. اگر هنوز در قلعهٔ خودتان مردم و ساختمان داشته باشید بخشی از ارتش همچنان به قلعهٔ شما حمله می‌کند؛ در غیر این صورت تمام ارتش به سوی قلعهٔ محل حضور لردتان می‌رود.
hiding_group: پنهان شدن لرد در قلعهٔ متحد
hiding_group_details: وقتی هوش مصنوعی به شما حمله می‌کند در حالی که لردتان درون قلعهٔ متحد نشسته است، هوش مصنوعی به‌جای محاصرهٔ صرف قلعهٔ خالی شما، به سراغ آن قلعه هم می‌رود.
hiding_siege: هدف محاصرهٔ کامل
hiding_siege_hiding: قلعه‌ای که لرد شما در آن است
hiding_siege_home: قلعهٔ خودتان
hiding_siege_tooltip: |-
  هوش مصنوعی در هر زمان فقط می‌تواند یک محاصرهٔ کامل برنامه‌ریزی کند (چادرهای محاصره، مهندسان، نردبان‌ها، پر کردن خندق). این گزینه تعیین می‌کند کدام قلعه هدف محاصرهٔ کامل باشد. قلعهٔ دیگر را نیروهای جداشده به‌طور مستقل هدف می‌گیرند.

  هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
hiding_split: سهم ارتش اعزامی به قلعهٔ دیگر (٪)
hiding_split_tooltip: |-
  چه درصدی از ارتش مهاجم برای حمله به قلعه‌ای که محاصرهٔ کامل دریافت نمی‌کند جدا شود. ادوات محاصره، مهندسان، نردبان‌داران و تونل‌کن‌ها همیشه همراه محاصرهٔ اصلی می‌مانند. مقدار 0 کل ارتش را به قلعه‌ای می‌فرستد که لرد شما در آن است.

  هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
hiding_switch_alive: تغییر هدف در میانهٔ حمله تنها در صورت باقی ماندن این سهم از ارتش (٪)
hiding_switch_alive_tooltip: |-
  اگر لرد شما در حالی که حمله آغاز شده وارد قلعهٔ متحد شود، مهاجمان تنها در صورتی تغییر هدف می‌دهند که دست‌کم این درصد از نیروهای اولیه‌شان زنده باشد. ارتشی که نیمه‌شکست‌خورده است حملهٔ فعلی خود را ادامه می‌دهد.

  هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
hunt_enabled: اعزام نیرو برای تعقیب لرد
hunt_enabled_details: ابتدا نیروهای ارتش اصلی که به لرد شما نزدیک‌ترند و سپس دیگر نیروهای حمله برای تعقیب اعزام می‌شوند. اگر همهٔ تعقیب‌کنندگان کشته شوند، بقیهٔ آن ارتش به سوی لرد می‌روند. اگر راه او دوباره بسته شود (دیوار تعمیر شود)، تعقیب‌کنندگان به محاصره بازمی‌گردند. هوش مصنوعی همچنان دقیقاً مانند قبل دربارهٔ عقب‌نشینی تصمیم می‌گیرد.
hunt_group: تعقیب لرد
hunt_group_details: هرگاه مهاجمان راه بازی به سوی لرد شما داشته باشند — از طریق دیوار یا دروازهٔ ویران‌شده، نردبان، برج محاصره، تونل فرو ریخته یا قرار گرفتن او در فضای باز — بخشی از آن‌ها مستقیماً به سوی او یورش می‌برند و بقیه محاصره را ادامه می‌دهند.
hunt_share: سهم ارتش برای تعقیب لرد (٪)
hunt_share_tooltip: |-
  چه درصدی از ارتش مهاجم به قلعهٔ محل حضور لردتان به تعقیب او می‌رود. ادوات محاصره، مهندسان، نردبان‌داران و تونل‌کن‌ها هرگز این کار را نمی‌کنند.

  هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
