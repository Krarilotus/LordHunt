hunt_enabled: Lordun peşine birlik gönder
hunt_enabled_details: |-
  Avcılar önce ana ordunun lorduna en yakın birliklerinden, ardından saldırının diğer birliklerinden seçilir. Hepsi ölürse ordunun kalanı da lorda yönelir. Ona giden yol tekrar kapanırsa (sur onarılırsa) avcılar kuşatmaya döner. Yapay zekânın ne zaman geri çekileceği eskisiyle tamamen aynı kalır.

  Varsayılan olarak açık.
hunt_group: Lord avı
hunt_group_details: |-
  Saldıranların lorduna açık bir yolu olduğunda — yıkılmış bir sur veya kapı binası, merdiven, kuşatma kulesi, çökmüş tünel yoluyla ya da lord açık alanda durduğunda — bir kısmı doğrudan ona yönelir, geri kalanı kuşatmayı sürdürür.

  Lordu avlayan ordu payı (%) — Lordunun bulunduğu kaleye saldıran ordunun ne kadarının onun peşine düşeceği. Kuşatma araçları, mühendisler, merdivenciler ve tünelciler buna asla katılmaz.

  Varsayılan: 50. Yapay zekâ kişiliği (AIC) kendi değerini belirtmediğinde kullanılır.
hunt_share: Lordu avlayan ordu payı (%)
