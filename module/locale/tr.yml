ai: Yapay zekâ
diagnostics_group: Tanılama
diagnostics_group_descr: Test ve hata ayıklama için.
diagnostics_log: Saldıranların kararlarını günlüğe yaz
diagnostics_log_details: |-
  Bir saldırı başka bir kaleye yönlendirildiğinde, birlikler ayrıldığında veya avcılar yola çıkıp döndüğünde ucp3.log dosyasına bir satır yazar.

  Varsayılan olarak kapalı.
hiding_enabled: Lordunun saklandığı kaleye saldır
hiding_enabled_details: |-
  Lordun kendi surlarının dışında ve saldıranların yürüyerek giremediği bir müttefik kalenin surları içindeyken saldırı o kaleye yönlendirilir. Kendi kalende hâlâ insanlar ve binalar varsa ordunun bir kısmı yine oraya saldırır; aksi hâlde tüm ordu lordunun bulunduğu kaleye gider.

  Varsayılan olarak açık.
hiding_group: Müttefik kalesinde saklanan lord
hiding_group_details: |-
  Bir yapay zekâ, lordun müttefik kalesindeyken sana saldırdığında yalnızca boş kaleni kuşatmak yerine o kaleye de yönelir.

  Tam kuşatma hedefi — Yapay zekâ aynı anda yalnızca bir tam kuşatma planlayabilir (kuşatma çadırları, mühendisler, merdivenler, hendek doldurma). Bu ayar hangi kalenin tam kuşatma alacağını seçer. Diğer kaleye ayrılan birlikler kendi başına saldırır: ulaşabildikleri en yakın binayı, sonra bir sonrakini yıkarlar; ulaşacak bina kalmayınca surlara vururlar. Okçuları ve arbaletçileri de yanlarında yürüyüp karşılaştıkları birliklere ateş eder.

  Varsayılan: Lordunun bulunduğu kale. Yapay zekâ kişiliği (AIC) kendi değerini belirtmediğinde kullanılır.

  Diğer kaleye gönderilen ordu payı (%) — Tam kuşatmayı almayan kaleye saldırmak için ana ordudan ayrılan kısım. Kuşatma araçları, mühendisler, merdivenciler ve tünelciler her zaman ana kuşatmada kalır. 0 değeri tüm orduyu lordunun bulunduğu kaleye gönderir.

  Varsayılan: 50. Yapay zekâ kişiliği (AIC) kendi değerini belirtmediğinde kullanılır.

  Saldırı ortasında hedef değişimi için gereken en az kalan ordu (%) — Saldırı zaten başlamışken lordun bir müttefik kalesine girerse, saldıranlar yalnızca başlangıçtaki birliklerinin en az bu kadarı hayattaysa hedef değiştirir. Yarı yarıya erimiş bir ordu mevcut hedefine saldırmayı sürdürür.

  Varsayılan: 80. Yapay zekâ kişiliği (AIC) kendi değerini belirtmediğinde kullanılır.
