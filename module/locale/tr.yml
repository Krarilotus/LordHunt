ai: Yapay zekâ
diagnostics_group: Tanılama
diagnostics_group_descr: Test ve hata ayıklama için.
diagnostics_log: Saldıranların kararlarını günlüğe yaz
diagnostics_log_details: Bir saldırı başka bir kaleye yönlendirildiğinde, birlikler ayrıldığında veya avcılar yola çıkıp döndüğünde ucp3.log dosyasına bir satır yazar.
hiding_enabled: Lordunun saklandığı kaleye saldır
hiding_enabled_details: Lordun kendi surlarının dışında ve saldıranların yürüyerek giremediği bir müttefik kalenin surları içindeyken saldırı o kaleye yönlendirilir. Kendi kalende hâlâ insanlar ve binalar varsa ordunun bir kısmı yine oraya saldırır; aksi hâlde tüm ordu lordunun bulunduğu kaleye gider.
hiding_group: Müttefik kalesinde saklanan lord
hiding_group_details: Bir yapay zekâ, lordun müttefik kalesindeyken sana saldırdığında yalnızca boş kaleni kuşatmak yerine o kaleye de yönelir.
hiding_siege: Tam kuşatma hedefi
hiding_siege_hiding: Lordunun bulunduğu kale
hiding_siege_home: Kendi kalen
hiding_siege_tooltip: |-
  Yapay zekâ aynı anda yalnızca bir tam kuşatma planlayabilir (kuşatma çadırları, mühendisler, merdivenler, hendek doldurma). Bu ayar hangi kalenin tam kuşatma alacağını seçer. Diğer kaleye ayrılan birlikler kendi başına saldırır.

  Yapay zekâ kişiliği (AIC) kendi değerini belirtmediğinde kullanılır.
hiding_split: Diğer kaleye gönderilen ordu payı (%)
hiding_split_tooltip: |-
  Tam kuşatmayı almayan kaleye saldırmak için ana ordudan ayrılan kısım. Kuşatma araçları, mühendisler, merdivenciler ve tünelciler her zaman ana kuşatmada kalır. 0 değeri tüm orduyu lordunun bulunduğu kaleye gönderir.

  Yapay zekâ kişiliği (AIC) kendi değerini belirtmediğinde kullanılır.
hiding_switch_alive: Saldırı ortasında hedef değişimi için gereken en az kalan ordu (%)
hiding_switch_alive_tooltip: |-
  Saldırı zaten başlamışken lordun bir müttefik kalesine girerse, saldıranlar yalnızca başlangıçtaki birliklerinin en az bu kadarı hayattaysa hedef değiştirir. Yarı yarıya erimiş bir ordu mevcut hedefine saldırmayı sürdürür.

  Yapay zekâ kişiliği (AIC) kendi değerini belirtmediğinde kullanılır.
hunt_enabled: Lordun peşine birlik gönder
hunt_enabled_details: Avcılar önce ana ordunun lorduna en yakın birliklerinden, ardından saldırının diğer birliklerinden seçilir. Hepsi ölürse ordunun kalanı da lorda yönelir. Ona giden yol tekrar kapanırsa (sur onarılırsa) avcılar kuşatmaya döner. Yapay zekânın ne zaman geri çekileceği eskisiyle tamamen aynı kalır.
hunt_group: Lord avı
hunt_group_details: Saldıranların lorduna açık bir yolu olduğunda — yıkılmış bir sur veya kapı binası, merdiven, kuşatma kulesi, çökmüş tünel yoluyla ya da lord açık alanda durduğunda — bir kısmı doğrudan ona yönelir, geri kalanı kuşatmayı sürdürür.
hunt_share: Lordu avlayan ordu payı (%)
hunt_share_tooltip: |-
  Lordunun bulunduğu kaleye saldıran ordunun ne kadarının onun peşine düşeceği. Kuşatma araçları, mühendisler, merdivenciler ve tünelciler buna asla katılmaz.

  Yapay zekâ kişiliği (AIC) kendi değerini belirtmediğinde kullanılır.
improvements: İyileştirmeler
misc: Diğer
