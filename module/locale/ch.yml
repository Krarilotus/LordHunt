ai: AI
diagnostics_group: 诊断
diagnostics_group_descr: 用于测试和排查问题。
diagnostics_log: 将进攻方决策写入日志
diagnostics_log_details: 每当进攻被转移到另一座城堡、部队分兵，或追击部队出发与返回时，向 ucp3.log 写入一行记录。
hiding_enabled: 进攻领主躲藏的城堡
hiding_enabled_details: 当你的领主位于自家城墙之外，且躲在进攻方无法直接步入的盟友城堡城墙内时，AI 会将进攻指向那座城堡。如果你的城堡里仍有居民和建筑，一部分军队仍会进攻你的城堡；否则整支军队都会进攻领主所在的城堡。
hiding_group: 领主躲藏在盟友城堡中
hiding_group_details: 当 AI 进攻你而你的领主躲在盟友城堡里时，AI 也会转而进攻那座城堡，而不再只围攻你的空城。
hiding_siege: 全面围攻目标
hiding_siege_hiding: 领主所在的城堡
hiding_siege_home: 你自己的城堡
hiding_siege_tooltip: |-
  AI 一次只能策划一场完整的攻城战（攻城帐篷、工程师、云梯、填埋护城河）。此项决定哪座城堡承受全面围攻。另一座城堡则由分兵部队独立进攻。

  当 AI 个性文件（AIC）未单独指定时生效。
hiding_split: 派往另一座城堡的兵力比例（%）
hiding_split_tooltip: |-
  进攻军队中有多少比例会分兵去打未受全面围攻的那座城堡。攻城器械、工程师、云梯兵和隧道工始终留在全面围攻一侧。设为 0 会将全军派往领主所在的城堡。

  当 AI 个性文件（AIC）未单独指定时生效。
hiding_switch_alive: 进攻途中切换目标所需最低剩余兵力（%）
hiding_switch_alive_tooltip: |-
  如果你的领主在进攻已经开始后才溜进盟友城堡，只有当进攻方仍保留至少这一比例的初始兵力时才会切换目标。已损失过半的军队会继续打原定目标。

  当 AI 个性文件（AIC）未单独指定时生效。
hunt_enabled: 派兵直接追击领主
hunt_enabled_details: 追击部队优先挑选主力部队中距离你领主最近的单位，其次是进攻中的其他部队。如果追击部队全灭，剩余的该支军队会继续扑向领主。如果通往领主的道路再次被堵上（例如城墙被修复），追击部队会返回继续攻城。AI 仍按原版逻辑决定何时撤退。
hunt_group: 领主追击
hunt_group_details: 一旦进攻方拥有通向你领主的畅通路径——无论是被摧毁的城墙或城门、云梯、攻城塔、塌陷的隧道，还是领主本身暴露在城外——其中一部分部队会直扑领主，其余部队继续攻城。
hunt_share: 追击领主的兵力比例（%）
hunt_share_tooltip: |-
  进攻领主所在城堡的军队中有多少比例会直接追击领主。攻城器械、工程师、云梯兵和隧道工绝不参与追击。

  当 AI 个性文件（AIC）未单独指定时生效。
improvements: 改进
misc: 其他
