ai: ИИ
diagnostics_group: Диагностика
diagnostics_group_descr: Для тестирования.
diagnostics_log: Записывать решения атакующих в журнал
diagnostics_log_details: Записывает строку в ucp3.log каждый раз, когда атака перенаправляется на другой замок, войска разделяются или охотники выступают за лордом и возвращаются.
hiding_enabled: Атаковать замок, в котором прячется ваш лорд
hiding_enabled_details: Если ваш лорд находится за пределами ваших стен, но внутри стен союзного замка, куда атакующие не могут свободно войти, атака перенаправляется на этот замок. Часть армии всё ещё атакует ваш собственный замок, если там остались жители и здания; в противном случае вся армия идёт на замок, где укрылся ваш лорд.
hiding_group: Лорд прячется в замке союзника
hiding_group_details: Когда ИИ атакует вас, а ваш лорд сидит внутри замка союзника, ИИ атакует и этот замок, вместо того чтобы осаждать лишь вашу пустую крепость.
hiding_siege: Куда направить основную осаду
hiding_siege_hiding: Замок, в котором ваш лорд
hiding_siege_home: Ваш собственный замок
hiding_siege_tooltip: |-
  ИИ может планировать лишь одну полноценную осаду за раз (осадные лагеря, инженеры, лестницы, засыпка рва). Эта настройка выбирает, какой замок её получит. Второй замок атакуют отделившиеся войска самостоятельно: они бьют ближайшее доступное здание, затем следующее, а если зданий в досягаемости нет — ломают стены. Их лучники и арбалетчики идут следом и обстреливают встреченных врагов.

  Используется, если личность ИИ (AIC) не задаёт своё значение.
hiding_split: Доля армии, отправляемая к другому замку (%)
hiding_split_tooltip: |-
  Какая часть атакующей армии отделяется для нападения на замок, не получивший основную осаду. Осадные орудия, инженеры, лестничники и подкопщики всегда остаются при основной осаде. Значение 0 отправляет всю армию к замку с вашим лордом.

  Используется, если личность ИИ (AIC) не задаёт своё значение.
hiding_switch_alive: Менять цель в ходе атаки только при сохранении не менее этой доли армии (%)
hiding_switch_alive_tooltip: |-
  Если ваш лорд перебирается в замок союзника во время уже начавшейся атаки, нападающие переключаются только если у них осталась как минимум эта доля исходных войск. Наполовину разбитая армия продолжает начатую атаку.

  Используется, если личность ИИ (AIC) не задаёт своё значение.
hunt_enabled: Отправлять войска в погоню за лордом
hunt_enabled_details: Первыми на охоту идут отряды основной армии, ближайшие к вашему лорду, затем остальные атакующие войска. Если все охотники погибают, на лорда идёт оставшаяся часть этой армии. Если путь к нему снова перекрыт (стена починена), охотники возвращаются к осаде. Решение об отступлении ИИ принимает точно так же, как раньше.
hunt_group: Охота на лорда
hunt_group_details: Когда у атакующих появляется свободный путь к вашему лорду — через пролом в стене или воротах, лестницу, осадную башню, обрушившийся подкоп или потому что он стоит на открытом месте — часть войск устремляется прямо к нему, пока остальные продолжают осаду.
hunt_share: Доля армии, охотящаяся на лорда (%)
hunt_share_tooltip: |-
  Какая часть армии, штурмующей замок с вашим лордом, бросается за ним. Осадные орудия, инженеры, лестничники и подкопщики никогда не участвуют в погоне.

  Используется, если личность ИИ (AIC) не задаёт своё значение.
improvements: Улучшения
misc: Разное
