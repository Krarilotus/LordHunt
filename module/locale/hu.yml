ai: MI
diagnostics_group: Diagnosztika
diagnostics_group_descr: Teszteléshez.
diagnostics_log: A támadók döntéseinek naplózása
diagnostics_log_details: Sort ír a ucp3.log fájlba, amikor egy támadás másik várra irányul, csapatok válnak le, vagy a vadászok elindulnak illetve visszatérnek.
hiding_enabled: A lordodat rejtő vár megtámadása
hiding_enabled_details: Ha a lordod a saját falaidon kívül, de egy szövetséges vár falain belül tartózkodik, ahová a támadók nem tudnak besétálni, a támadás arra a várra irányul. A sereg egy része továbbra is a saját váradat támadja, ha még vannak ott embereid és épületeid; különben az egész sereg a lordodat rejtő vár ellen vonul.
hiding_group: Szövetséges várban rejtőző lord
hiding_group_details: Amikor egy MI megtámad, miközben a lordod egy szövetséges várában ül, az MI azt a várat is célba veszi ahelyett, hogy csak az üres otthonodat ostromolná.
hiding_siege: A teljes ostrom célpontja
hiding_siege_hiding: A vár, amelyben a lordod van
hiding_siege_home: A saját várad
hiding_siege_tooltip: |-
  Az MI egyszerre csak egy teljes ostromot tud megtervezni (ostromsátrak, mérnökök, létrák, árokbetemetés). Itt választható ki, melyik vár kapja ezt. A másik várat a leváló csapatok önállóan támadják: a legközelebbi elérhető épületet rombolják, majd a következőt, és ha semmi nem elérhető, a falakat támadják. Az íjászaik és számszeríjászaik velük mennek, és a szembejövő csapatokra lőnek.

  Akkor érvényes, ha az MI személyisége (AIC) nem ad meg saját értéket.
hiding_split: A másik vár ellen küldött sereg aránya (%)
hiding_split_tooltip: |-
  A támadó sereg mekkora része válik le a teljes ostromot nem kapó vár ellen. Az ostromgépek, mérnökök, létrahordozók és alagútásók mindig a fő ostromnál maradnak. A 0 az egész sereget a lordodat rejtő vár ellen küldi.

  Akkor érvényes, ha az MI személyisége (AIC) nem ad meg saját értéket.
hiding_switch_alive: Támadás közbeni célváltás csak ennyi megmaradt sereg esetén (%)
hiding_switch_alive_tooltip: |-
  Ha a lordod már folyamatban lévő támadás közben bújik szövetséges várba, a támadók csak akkor váltanak célpontot, ha az elindult csapataik legalább ekkora része még él. Egy félig megtépázott sereg folytatja a megkezdett ostromot.

  Akkor érvényes, ha az MI személyisége (AIC) nem ad meg saját értéket.
hunt_enabled: Csapatok küldése a lord után
hunt_enabled_details: Először a lordodhoz legközelebb álló fősereg-egységek indulnak vadászatra, majd a támadás többi csapata. Ha mind meghalnak, a sereg többi része is a lordra tör. Ha az út újra bezárul (megjavítod a falat), a vadászok visszatérnek az ostromhoz. A visszavonulásról továbbra is pontosan ugyanúgy dönt az MI.
hunt_group: Vadászat a lordra
hunt_group_details: Amint a támadóknak szabad útjuk nyílik a lordodhoz — áttört falon vagy kapun, létrán, ostromtornyon, beomlott alagúton át, vagy mert a nyílt terepen áll —, egy részük azonnal rá ront, míg a többiek folytatják az ostromot.
hunt_share: A lordra vadászó sereg aránya (%)
hunt_share_tooltip: |-
  A lordodat rejtő várat támadó sereg mekkora része indul utána. Az ostromgépek, mérnökök, létrahordozók és alagútásók soha nem vesznek részt ebben.

  Akkor érvényes, ha az MI személyisége (AIC) nem ad meg saját értéket.
